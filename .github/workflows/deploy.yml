name: Deploy to GitHub Pages
on:
  push:
    branches: [ccr-d21528c9-6m1frs]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - run: node --test tests/unit/*.test.mjs
      - name: Ensure PostgreSQL server binaries (runner images change)
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || command -v initdb || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql)
      - run: node tests/db/run.mjs
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Natural voice: clips are cached between deploys, so only new sentences are synthesised.
      # Without the GOOGLE_TTS_API_KEY secret this makes nothing and the app uses the device voice.
      - name: Restore natural-voice clips
        uses: actions/cache/restore@v4
        with:
          path: audio
          key: tts-v1-${{ github.sha }}
          restore-keys: tts-v1-
      - name: Natural voice (Google Cloud Text-to-Speech)
        continue-on-error: true   # a voice problem must never block a deploy
        run: node scripts/gen-audio.mjs --prune
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TTS_VOICE_MS: ${{ vars.TTS_VOICE_MS || 'ms-MY-Wavenet-A' }}
          TTS_VOICE_EN: ${{ vars.TTS_VOICE_EN || 'en-US-Neural2-F' }}
      - name: Save natural-voice clips
        if: hashFiles('audio/*.mp3') != ''
        uses: actions/cache/save@v4
        with:
          path: audio
          key: tts-v1-${{ hashFiles('audio/*.mp3') }}
      # Public values (they ship to every browser in config.js anyway). Repository Variables or
      # Secrets override the defaults below; build-site.mjs refuses secret/service-role keys.
      - name: Build static site (config.js from repository variables)
        run: node scripts/build-site.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://menmgnescedqpqomdzrq.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_4xfOTWURV7S3f641KLnBUg_RYTERffO' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
